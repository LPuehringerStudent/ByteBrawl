<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteBrawl</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 16px 24px;
        box-sizing: border-box;
      }
      .player-panel {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        padding: 10px 14px;
        min-width: 140px;
      }
      .player-icon {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        background-size: cover;
        background-position: center;
        border: 2px solid;
      }
      .player-info {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .player-name {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .player-damage {
        font-size: 22px;
        font-weight: 800;
      }
      .player-stocks {
        font-size: 12px;
        opacity: 0.85;
      }
      #timer {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 20px;
        font-weight: 700;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 16px;
        border-radius: 8px;
      }
      #win-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 32px;
        font-weight: 800;
        color: #ffd700;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        display: none;
      }
      .p1 { color: #00ffff; border-color: #00ffff; }
      .p2 { color: #ff00ff; border-color: #ff00ff; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui-overlay">
      <div id="timer">3:00</div>
      <div class="player-panel">
        <div id="p1-icon" class="player-icon p1"></div>
        <div class="player-info">
          <div id="p1-name" class="player-name p1">Byte</div>
          <div id="p1-damage" class="player-damage p1">0%</div>
          <div id="p1-stocks" class="player-stocks">Stocks: 3</div>
        </div>
      </div>
      <div class="player-panel">
        <div class="player-info" style="text-align: right;">
          <div id="p2-name" class="player-name p2">Nibble</div>
          <div id="p2-damage" class="player-damage p2">0%</div>
          <div id="p2-stocks" class="player-stocks">Stocks: 3</div>
        </div>
        <div id="p2-icon" class="player-icon p2"></div>
      </div>
      <div id="win-message"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
